version: 2

models:
  - name: stg_customer
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null
      - name: nation_key
        data_tests:
          - relationships:
              to: ref('stg_nation')
              field: nation_key
      - name: market_segment
        data_tests:
          - accepted_values:
              values:
                [
                  'AUTOMOBILE',
                  'BUILDING',
                  'FURNITURE',
                  'HOUSEHOLD',
                  'MACHINERY',
                ]

  - name: stg_orders
    columns:
      - name: order_key
        data_tests:
          - unique
          - not_null
      - name: customer_key
        data_tests:
          - relationships:
              to: ref('stg_customer')
              field: customer_key
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['P', 'O', 'F']
      - name: order_priority
        data_tests:
          - accepted_values:
              values:
                ['1-URGENT', '2-HIGH', '3-MEDIUM', '4-NOT SPECIFIED', '5-LOW']

  - name: stg_lineitem
    columns:
      - name: line_item_key
        data_tests:
          - unique
          - not_null
      - name: order_key
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_key
      - name: part_key
        data_tests:
          - relationships:
              to: ref('stg_part')
              field: part_key
      - name: supplier_key
        data_tests:
          - relationships:
              to: ref('stg_supplier')
              field: supplier_key
      - name: return_flag
        data_tests:
          - accepted_values:
              values: ['A', 'N', 'R']
      - name: line_status
        data_tests:
          - accepted_values:
              values: ['F', 'O']
      - name: ship_mode
        data_tests:
          - accepted_values:
              values: ['AIR', 'FOB', 'MAIL', 'RAIL', 'REG AIR', 'SHIP', 'TRUCK']

  - name: stg_part
    columns:
      - name: part_key
        data_tests:
          - unique
          - not_null
