version: 2

models:
  - name: stg_customer
    description: Staging table of customers, which was cloned by using CTAS from TPCH_SF1.CUSTOMERS
    columns:
      - name: customer_key
        description: Primary Key
        data_tests:
          - unique
          - not_null
      - name: nation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nation')
                field: nation_key
      - name: market_segment
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    'AUTOMOBILE',
                    'BUILDING',
                    'FURNITURE',
                    'HOUSEHOLD',
                    'MACHINERY',
                  ]

  - name: stg_orders
    columns:
      - name: order_key
        data_tests:
          - unique
          - not_null
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customer')
                field: customer_key
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['P', 'O', 'F']
      - name: order_priority
        data_tests:
          - accepted_values:
              arguments:
                values:
                  ['1-URGENT', '2-HIGH', '3-MEDIUM', '4-NOT SPECIFIED', '5-LOW']

  - name: stg_lineitem
    columns:
      - name: line_item_key
        data_tests:
          - unique
          - not_null
      - name: order_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_key
      - name: part_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_part')
                field: part_key
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_supplier')
                field: supplier_key
      - name: return_flag
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'N', 'R']
      - name: line_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'O']
      - name: ship_mode
        data_tests:
          - accepted_values:
              arguments:
                values:
                  ['AIR', 'FOB', 'MAIL', 'RAIL', 'REG AIR', 'SHIP', 'TRUCK']

  - name: stg_part
    columns:
      - name: part_key
        data_tests:
          - unique
          - not_null

  - name: stg_partsupp
    columns:
      - name: part_supplier_key
        data_tests:
          - unique
          - not_null
      - name: part_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_part')
                field: part_key
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_supplier')
                field: supplier_key

  - name: stg_supplier
    columns:
      - name: supplier_key
        data_tests:
          - unique
          - not_null
      - name: nation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nation')
                field: nation_key
      - name: supplier_name
        data_tests:
          - not_null

  - name: stg_nation
    columns:
      - name: nation_key
        data_tests:
          - unique
          - not_null
      - name: nation_name
        data_tests:
          - unique
          - not_null
      - name: region_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_region')
                field: region_key

  - name: stg_region
    columns:
      - name: region_key
        data_tests:
          - unique
          - not_null
      - name: region_name
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['AMERICA', 'ASIA', 'AFRICA', 'MIDDLE EAST', 'EUROPE']
