version: 2

models:
  - name: dim_supplier
    columns:
      - name: supplier_key
        data_tests:
          - unique
          - not_null
      - name: nation_name
        data_tests:
          - not_null

  - name: dim_geography
    columns:
      - name: nation_key
        data_tests:
          - unique
          - not_null
      - name: nation_name
        data_tests:
          - unique
          - not_null
      - name: region_name
        data_tests:
          - not_null

  - name: dim_part
    columns:
      - name: part_key
        data_tests:
          - unique
          - not_null

  - name: dim_customer
    columns:
      - name: customer_key
        data_tests:
          - not_null
      - name: nation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nation')
                field: nation_key
      - name: market_segment
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    'AUTOMOBILE',
                    'BUILDING',
                    'MACHINERY',
                    'HOUSEHOLD',
                    'FURNITURE',
                  ]
      - name: dbt_scd_id
        data_tests:
          - unique
          - not_null
      - name: valid_from
        data_tests:
          - not_null

  - name: fct_orders
    columns:
      - name: order_key
        data_tests:
          - unique
          - not_null
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: customer_version_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: dbt_scd_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: total_quantity
        data_tests:
          - not_null
      - name: total_net_amount
        data_tests:
          - not_null
      - name: total_gross_revenue
        data_tests:
          - not_null
      - name: total_tax_amount
        data_tests:
          - not_null
      - name: line_item_count
        data_tests:
          - not_null

  - name: fct_lineitem
    columns:
      - name: line_item_key
        data_tests:
          - unique
          - not_null
      - name: customer_version_key
        data_tests:
          - not_null
      - name: order_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_key
      - name: part_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_part')
                field: part_key
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
      - name: ship_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: commit_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: receipt_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: loaded_at
        data_tests:
          - not_null

  - name: fct_daily_sales_summary
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_date
              - nation_key
    columns:
      - name: nation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: nation_key
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
